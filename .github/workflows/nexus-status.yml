name: Read Nexus release status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm existing initial Nexus upload
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: python tools/nexus_status.py
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-status
          path: dist/nexus-status.json
